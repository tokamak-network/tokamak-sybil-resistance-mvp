version: '3'

services:
  db:
    image: postgres:14.13
    restart: always
    environment:
      - POSTGRES_DB=statedb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - POSTGRES_PORT=5432
    container_name: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  sequencer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PGHOST=db
    depends_on:
      - db